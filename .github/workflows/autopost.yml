name: Daily Viral Pets 2x Auto-Poster

on:
  schedule:
    # 2x daily: 11:00 UTC (12:00 CET) & 17:00 UTC (18:00 CET)
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  post-viral-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests yt-dlp

      - name: Fetch, Process and Publish Viral Video
        run: |
          python runner.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

      - name: Commit & Push Updated History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_ids.json
          if git diff --staged --quiet; then
            echo "No changes in posted_ids.json"
          else
            git commit -m "Auto: Update posted_ids.json [skip ci]"
            git push
          fi
